name: Build Charly Music APK

on:
  push:
    branches:
      - agent/charly-music-apk-builder
    paths:
      - '.github/workflows/charly-music-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/charly-music-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Clone SimpMusic dev with submodules
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules -b dev \
            https://github.com/maxrave-dev/SimpMusic.git CharlyMusic

      - name: Personalize as Charly Music
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('CharlyMusic')

          gradle = root / 'androidApp/build.gradle.kts'
          text = gradle.read_text(encoding='utf-8')
          text, count = re.subn(
              r'applicationId\s*=\s*"com\.maxrave\.simpmusic"',
              'applicationId = "com.charly.music"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not replace applicationId')
          text = text.replace('applicationIdSuffix = ".dev"', 'applicationIdSuffix = ".personal"')
          text = text.replace('versionNameSuffix = "-dev"', 'versionNameSuffix = "-personal"')
          gradle.write_text(text, encoding='utf-8')

          props = root / 'gradle.properties'
          text = props.read_text(encoding='utf-8')
          if re.search(r'(?m)^isFullBuild\s*=', text):
              text = re.sub(r'(?m)^isFullBuild\s*=.*$', 'isFullBuild=false', text)
          else:
              text += '\nisFullBuild=false\n'
          props.write_text(text, encoding='utf-8')

          settings = root / 'settings.gradle.kts'
          text = settings.read_text(encoding='utf-8')
          text = text.replace('rootProject.name = "SimpMusic"', 'rootProject.name = "CharlyMusic"')
          settings.write_text(text, encoding='utf-8')

          for rel in [
              'androidApp/src/main/res/values/app_name.xml',
              'androidApp/src/debug/res/values/app_name.xml',
          ]:
              path = root / rel
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(
                  r'(<string\s+name="app_name">).*?(</string>)',
                  r'\1Charly Music\2',
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'Could not rename app in {rel}')
              path.write_text(text, encoding='utf-8')

          (root / 'PERSONAL_FORK_NOTICE.md').write_text(
              '# Charly Music\n\n'
              'Private modified build based on maxrave-dev/SimpMusic.\n\n'
              'The original GPL-3.0 LICENSE is retained. The Kotlin namespace remains unchanged; '
              'only the Android application ID and visible branding are changed in this first build.\n',
              encoding='utf-8',
          )
          print('Personalization complete')
          PY

      - name: Verify personalization
        shell: bash
        run: |
          grep -n 'applicationId = "com.charly.music"' CharlyMusic/androidApp/build.gradle.kts
          grep -n 'isFullBuild=false' CharlyMusic/gradle.properties
          cat CharlyMusic/androidApp/src/main/res/values/app_name.xml

      - name: Generate library definitions
        working-directory: CharlyMusic
        run: ./gradlew exportLibraryDefinitions --stacktrace

      - name: Build debug APK
        working-directory: CharlyMusic
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          APK=$(find CharlyMusic/androidApp/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" out/CharlyMusic-v0.1-personal-debug.apk
          sha256sum out/CharlyMusic-v0.1-personal-debug.apk | tee out/SHA256.txt

      - name: Upload Charly Music APK
        uses: actions/upload-artifact@v4
        with:
          name: CharlyMusic-v0.1-personal-apk
          path: out/
          retention-days: 14
